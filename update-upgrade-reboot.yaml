---
- name: Update Ubuntu systems and reboot if necessary
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600  # Consider cache valid for 1 hour

    - name: Perform dist-upgrade
      apt:
        upgrade: dist
        force_apt_get: yes
        autoremove: yes  # Remove unused packages
        autoclean: yes   # Clear out the local repository
      register: upgrade_result

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot system if required
      reboot:
        msg: "Rebooting system due to package updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required.stat.exists

    - name: Print update status
      debug:
        msg: "System has been updated successfully{% if reboot_required.stat.exists %} and rebooted{% endif %}"
